<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<style>

<body>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const dateInput = document.getElementById("date");

const resetButton = document.getElementById("reset");
const selectButton = document.getElementById("select");
const minusButton = document.getElementById("minus");
const plusButton = document.getElementById("plus");

const selectionInfo = document.getElementById("selectionInfo");
const selectionBar = document.getElementById("selectionBar");

const deleteSelectedButton =
  document.getElementById("deleteSelected");

const cancelSelectButton =
  document.getElementById("cancelSelect");


/* =========================
   編集画面
========================= */

const editModal =
  document.getElementById("editModal");

const editNumber =
  document.getElementById("editNumber");

const editComment =
  document.getElementById("editComment");

const editDelete =
  document.getElementById("editDelete");

const editCancel =
  document.getElementById("editCancel");

const editSave =
  document.getElementById("editSave");

let editingShot = null;


/* =========================
   弓道場・的の設定
========================= */

const TARGET_SPACING = 1800;
const TARGET_DIAMETER = 360;
const TARGET_RADIUS = 180;

const GROUND_Y = 270;
const CURTAIN_Y = -900;
const AZUCHI_TOP = -330;

const RECORD_TOP = -1200;
const RECORD_BOTTOM = 600;
const RECORD_LEFT = -1800;
const RECORD_RIGHT = 1800;


/* =========================
   矢の設定
========================= */

const SHOT_RADIUS = 9;

const OVERLAP_RADIUS = 5.4;


/* =========================
   矢の色
========================= */

const shotColors = [
  "#e53935",
  "#1976d2",
  "#2e9d50",
  "#f28c28",
  "#8e44ad",
  "#008b8b",
  "#d81b60",
  "#6d4c41"
];


/* =========================
   表示倍率
========================= */

let scale = 1;

const MIN_SCALE = 0.4;
const MAX_SCALE = 4;

let centerY = 0;


/* =========================
   データ
========================= */

let shots = [];

let selectionMode = false;
let selectedShots = new Set();

let selectionCycle = [];
let selectionCycleIndex = 0;

let lastSelectionX = null;
let lastSelectionY = null;


/* =========================================================
   入力状態
   ★ここをスマホ用に整理
========================================================= */

/*
  現在画面に触れている pointer
*/

const activePointers = new Map();


/*
  ピンチ中かどうか
*/

let isPinching = false;


/*
  ピンチ開始時の距離・倍率
*/

let pinchStartDistance = null;
let pinchStartScale = 1;


/*
  ズーム終了直後の誤タップ防止
*/

let justFinishedPinch = false;


/*
  ドラッグ中の矢
*/

let draggingShot = null;

let dragOffsetX = 0;
let dragOffsetY = 0;


/*
  タップ開始位置
*/

let pointerStartX = 0;
let pointerStartY = 0;


/*
  ドラッグ判定
*/

let moved = false;


/*
  シングルタップ待機
*/

let tapTimer = null;


/*
  直前にタップした矢
*/

let lastTapShot = null;


/*
  直前のタップ位置
*/

let lastTapX = 0;
let lastTapY = 0;


/*
  ダブルタップ判定時間
*/

const DOUBLE_TAP_TIME = 320;


/*
  タップ位置の許容範囲
*/

const DOUBLE_TAP_DISTANCE = 25;


/*
  ドラッグ開始判定
*/

const DRAG_THRESHOLD = 6;


/* =========================
   今日の日付
========================= */

function getTodayString() {

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

dateInput.value = getTodayString();


/* =========================
   保存・読み込み
========================= */

function getStorageKey() {

  return "kyudo_" + dateInput.value;
}


function loadShots() {

  const data =
    localStorage.getItem(getStorageKey());

  if (data) {

    try {

      shots = JSON.parse(data);

      shots.forEach((shot, index) => {

        if (
          typeof shot.number !== "number" ||
          !Number.isFinite(shot.number)
        ) {
          shot.number = index + 1;
        }

        if (
          typeof shot.comment !== "string"
        ) {
          shot.comment = "";
        }
      });

    } catch {

      shots = [];
    }

  } else {

    shots = [];
  }

  selectedShots.clear();
}


function saveShots() {

  localStorage.setItem(
    getStorageKey(),
    JSON.stringify(shots)
  );
}


/* =========================
   次の矢の番号
========================= */

function getNextShotNumber() {

  if (shots.length === 0) {
    return 1;
  }

  let maxNumber = 0;

  for (const shot of shots) {

    const n = Number(shot.number);

    if (
      Number.isFinite(n) &&
      n > maxNumber
    ) {
      maxNumber = n;
    }
  }

  return maxNumber + 1;
}


/* =========================
   キャンバスサイズ
========================= */

let W = 0;
let H = 0;
let dpr = 1;


function resize() {

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  draw();
}


/* =========================
   基準倍率
========================= */

function baseScale() {

  return W / (TARGET_SPACING * 2);
}


/* =========================
   座標変換
========================= */

function worldToScreen(x, y) {

  return {

    x:
      W / 2 +
      x * baseScale() * scale,

    y:
      H / 2 +
      (y - centerY) *
      baseScale() *
      scale
  };
}


function screenToWorld(x, y) {

  return {

    x:
      (x - W / 2) /
      (baseScale() * scale),

    y:
      (y - H / 2) /
      (baseScale() * scale) +
      centerY
  };
}


/* =========================
   霞的
========================= */

function drawKasumi(cx, cy) {

  const s =
    baseScale() * scale;

  const center = {

    x:
      W / 2 +
      cx * s,

    y:
      H / 2 +
      (cy - centerY) * s
  };


  const rings = [

    {
      r: 180,
      color: "#202020"
    },

    {
      r: 147,
      color: "#f8f6ed"
    },

    {
      r: 117,
      color: "#202020"
    },

    {
      r: 102,
      color: "#f8f6ed"
    },

    {
      r: 72,
      color: "#202020"
    },

    {
      r: 36,
      color: "#f8f6ed"
    }

  ];


  for (const ring of rings) {

    ctx.beginPath();

    ctx.arc(
      center.x,
      center.y,
      ring.r * s,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      ring.color;

    ctx.fill();
  }
}


/* =========================
   重なり判定
========================= */

function getOverlapGroup(shot) {

  const p =
    worldToScreen(
      shot.x,
      shot.y
    );

  return shots.filter(other => {

    const q =
      worldToScreen(
        other.x,
        other.y
      );

    const dx =
      p.x - q.x;

    const dy =
      p.y - q.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    return distance <= OVERLAP_RADIUS;
  });
}


function getShotColor(shot) {

  const group =
    getOverlapGroup(shot);

  if (group.length <= 1) {
    return "#e53935";
  }

  const index =
    group.indexOf(shot);

  return shotColors[
    index % shotColors.length
  ];
}


/* =========================
   コメント済み判定
========================= */

function hasComment(shot) {

  return (
    typeof shot.comment === "string" &&
    shot.comment.trim() !== ""
  );
}


/* =========================
   コメントマーク
========================= */

function drawCommentMark(p) {

  const x = p.x + 9;
  const y = p.y - 9;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    3,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#ffffff";
  ctx.fill();
}


/* =========================
   描画
========================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.fillStyle = "#b99668";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const curtain =
    worldToScreen(
      0,
      CURTAIN_Y
    );

  ctx.fillStyle = "#142f55";

  ctx.fillRect(
    0,
    0,
    W,
    curtain.y
  );


  const azuchiTop =
    worldToScreen(
      0,
      AZUCHI_TOP
    );

  ctx.fillStyle = "#b99668";

  ctx.fillRect(
    0,
    azuchiTop.y,
    W,
    H - azuchiTop.y
  );


  const ground =
    worldToScreen(
      0,
      GROUND_Y
    );

  ctx.strokeStyle = "#705335";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    0,
    ground.y
  );

  ctx.lineTo(
    W,
    ground.y
  );

  ctx.stroke();


  ctx.strokeStyle =
    "rgba(255,255,255,0.55)";

  ctx.lineWidth = 1;

  ctx.setLineDash([
    4,
    5
  ]);


  for (const x of [-900, 900]) {

    const p =
      worldToScreen(
        x,
        0
      );

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      0
    );

    ctx.lineTo(
      p.x,
      H
    );

    ctx.stroke();
  }

  ctx.setLineDash([]);


  drawKasumi(-1800, 0);
  drawKasumi(0, 0);
  drawKasumi(1800, 0);


  shots.forEach((shot) => {

    const p =
      worldToScreen(
        shot.x,
        shot.y
      );


    if (selectedShots.has(shot)) {

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        SHOT_RADIUS + 5,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ffffff";
      ctx.fill();
    }


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      SHOT_RADIUS,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      getShotColor(shot);

    ctx.fill();


    ctx.fillStyle = "#ffffff";

    ctx.font =
      "bold 10px sans-serif";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      shot.number,
      p.x,
      p.y + 0.5
    );


    if (hasComment(shot)) {

      drawCommentMark(p);
    }

  });


  if (selectionMode) {

    selectionInfo.style.display =
      "block";

    selectionBar.style.display =
      "flex";

    selectionInfo.textContent =
      selectedShots.size +
      "本選択中";

  } else {

    selectionInfo.style.display =
      "none";

    selectionBar.style.display =
      "none";
  }
}


/* =========================
   矢を探す
========================= */

function findShot(screenX, screenY) {

  for (
    let i = shots.length - 1;
    i >= 0;
    i--
  ) {

    const p =
      worldToScreen(
        shots[i].x,
        shots[i].y
      );

    const dx =
      screenX - p.x;

    const dy =
      screenY - p.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (distance <= 16) {

      return shots[i];
    }
  }

  return null;
}


/* =========================
   重なった矢を探す
========================= */

function findOverlappingShots(
  screenX,
  screenY
) {

  const result = [];

  for (const shot of shots) {

    const p =
      worldToScreen(
        shot.x,
        shot.y
      );

    const dx =
      screenX - p.x;

    const dy =
      screenY - p.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (distance <= 16) {

      result.push(shot);
    }
  }

  return result;
}


/* =========================
   矢を追加
========================= */

function addShot(
  screenX,
  screenY
) {

  /*
    ピンチ中・ピンチ直後は追加しない
  */

  if (isPinching || justFinishedPinch) {
    return;
  }

  const p =
    screenToWorld(
      screenX,
      screenY
    );


  if (
    p.x < RECORD_LEFT ||
    p.x > RECORD_RIGHT ||
    p.y < RECORD_TOP ||
    p.y > RECORD_BOTTOM
  ) {

    return;
  }


  shots.push({

    x: p.x,

    y: p.y,

    number:
      getNextShotNumber(),

    comment: ""
  });


  saveShots();

  draw();
}


/* =========================
   編集画面
========================= */

function openEditShot(shot) {

  editingShot = shot;

  editNumber.value =
    shot.number;

  editComment.value =
    shot.comment || "";

  editModal.style.display =
    "flex";

  setTimeout(() => {

    editComment.focus();

  }, 50);
}


function closeEditModal() {

  editingShot = null;

  editModal.style.display =
    "none";
}


/* =========================
   編集：保存
========================= */

editSave.addEventListener(
  "click",
  () => {

    if (!editingShot) {
      return;
    }


    let number =
      Number(editNumber.value);


    if (
      !Number.isFinite(number) ||
      number < 1
    ) {

      alert(
        "1以上の番号を入力してください。"
      );

      return;
    }


    number =
      Math.floor(number);


    const oldNumber =
      Number(editingShot.number);


    number =
      Math.min(
        number,
        shots.length
      );


    if (
      number < oldNumber
    ) {

      for (const shot of shots) {

        if (
          shot === editingShot
        ) {
          continue;
        }

        const n =
          Number(shot.number);

        if (
          n >= number &&
          n < oldNumber
        ) {

          shot.number =
            n + 1;
        }
      }
    }

    else if (
      number > oldNumber
    ) {

      for (const shot of shots) {

        if (
          shot === editingShot
        ) {
          continue;
        }

        const n =
          Number(shot.number);

        if (
          n > oldNumber &&
          n <= number
        ) {

          shot.number =
            n - 1;
        }
      }
    }


    editingShot.number =
      number;

    editingShot.comment =
      editComment.value;


    saveShots();

    closeEditModal();

    draw();
  }
);


/* =========================
   編集：削除
========================= */

editDelete.addEventListener(
  "click",
  () => {

    if (!editingShot) {
      return;
    }


    const ok =
      confirm(
        editingShot.number +
        "本目の矢を削除しますか？"
      );


    if (!ok) {
      return;
    }


    const deletedNumber =
      Number(editingShot.number);


    const index =
      shots.indexOf(
        editingShot
      );


    if (index !== -1) {

      shots.splice(
        index,
        1
      );
    }


    for (const shot of shots) {

      const n =
        Number(shot.number);

      if (n > deletedNumber) {

        shot.number =
          n - 1;
      }
    }


    selectedShots.delete(
      editingShot
    );


    saveShots();

    closeEditModal();

    draw();
  }
);


/* =========================
   編集：キャンセル
========================= */

editCancel.addEventListener(
  "click",
  () => {

    closeEditModal();
  }
);


editModal.addEventListener(
  "click",
  e => {

    if (
      e.target === editModal
    ) {

      closeEditModal();
    }
  }
);


/* =========================================================
   ポインター操作
   ★スマホ・PC共通でここだけを使う
========================================================= */


/* =========================
   ポインター数を取得
========================= */

function getActiveTouchPointers() {

  return Array.from(
    activePointers.values()
  ).filter(
    p => p.pointerType === "touch"
  );
}


/* =========================
   2点間距離
========================= */

function getPointerDistance() {

  const points =
    getActiveTouchPointers();

  if (points.length < 2) {
    return null;
  }

  const a = points[0];
  const b = points[1];

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =========================
   タップ予約キャンセル
========================= */

function cancelTap() {

  clearTimeout(tapTimer);

  tapTimer = null;

  lastTapShot = null;
}


/* =========================
   pointerdown
========================= */

canvas.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();


    /*
      ポインターを記録
    */

    activePointers.set(
      e.pointerId,
      {
        x: e.clientX,
        y: e.clientY,
        pointerType: e.pointerType
      }
    );


    /*
      タッチが2本以上になった
      → ピンチ開始
    */

    if (
      e.pointerType === "touch" &&
      getActiveTouchPointers().length >= 2
    ) {

      cancelTap();

      draggingShot = null;

      moved = true;

      isPinching = true;

      justFinishedPinch = false;

      pinchStartDistance =
        getPointerDistance();

      pinchStartScale =
        scale;

      return;
    }


    /*
      すでにピンチ中
    */

    if (isPinching) {

      return;
    }


    pointerStartX =
      e.clientX;

    pointerStartY =
      e.clientY;

    moved = false;


    /* =========================
       選択モード
    ========================= */

    if (selectionMode) {

      const candidates =
        findOverlappingShots(
          e.clientX,
          e.clientY
        );


      if (
        candidates.length === 0
      ) {

        return;
      }


      const samePosition =
        lastSelectionX !== null &&
        Math.abs(
          e.clientX -
          lastSelectionX
        ) < 16 &&
        Math.abs(
          e.clientY -
          lastSelectionY
        ) < 16;


      if (!samePosition) {

        selectionCycle =
          candidates;

        selectionCycleIndex = 0;

      } else {

        selectionCycleIndex++;

        if (
          selectionCycleIndex >=
          selectionCycle.length
        ) {

          selectionCycleIndex = 0;
        }
      }


      const shot =
        selectionCycle[
          selectionCycleIndex
        ];


      if (
        selectedShots.has(shot)
      ) {

        selectedShots.delete(
          shot
        );

      } else {

        selectedShots.add(
          shot
        );
      }


      lastSelectionX =
        e.clientX;

      lastSelectionY =
        e.clientY;


      draw();

      return;
    }


    /* =========================
       通常モード
    ========================= */

    const shot =
      findShot(
        e.clientX,
        e.clientY
      );


    /*
      既存の矢を触った
    */

    if (shot) {

      draggingShot = shot;


      const p =
        worldToScreen(
          shot.x,
          shot.y
        );


      dragOffsetX =
        p.x - e.clientX;

      dragOffsetY =
        p.y - e.clientY;


      /*
        ダブルタップ判定
      */

      const now =
        performance.now();


      const isDoubleTap =
        lastTapShot === shot &&
        now - lastTapTime <=
          DOUBLE_TAP_TIME &&
        Math.abs(
          e.clientX - lastTapX
        ) <= DOUBLE_TAP_DISTANCE &&
        Math.abs(
          e.clientY - lastTapY
        ) <= DOUBLE_TAP_DISTANCE;


      if (isDoubleTap) {

        cancelTap();

        draggingShot = null;

        openEditShot(
          shot
        );

        return;
      }


      /*
        1回目のタップ。
        ここではまだ矢を追加しない。
      */

      lastTapShot =
        shot;

      lastTapX =
        e.clientX;

      lastTapY =
        e.clientY;

      lastTapTime =
        now;


      clearTimeout(
        tapTimer
      );


      /*
        一定時間、2回目のタップを待つ。
      */

      tapTimer =
        setTimeout(
          () => {

            /*
              ピンチになっていたら
              何もしない。
            */

            if (
              isPinching ||
              justFinishedPinch
            ) {

              lastTapShot = null;
              tapTimer = null;

              return;
            }


            /*
              ドラッグされていない場合だけ
              新しい矢を追加。
              
              これにより、
              既存の矢をタップして
              その場所にさらに矢を記録できる。
            */

            if (!moved) {

              addShot(
                lastTapX,
                lastTapY
              );
            }


            lastTapShot =
              null;

            tapTimer =
              null;

          },
          DOUBLE_TAP_TIME
        );


      return;
    }


    /*
      空白をタップした場合も
      即時追加しない。

      少し待つことで、
      ピンチの1本目の指による
      誤追加を防ぐ。
    */

    clearTimeout(
      tapTimer
    );

    lastTapShot = null;

    lastTapX =
      e.clientX;

    lastTapY =
      e.clientY;


    tapTimer =
      setTimeout(
        () => {

          if (
            isPinching ||
            justFinishedPinch
          ) {

            tapTimer = null;

            return;
          }


          if (!moved) {

            addShot(
              lastTapX,
              lastTapY
            );
          }


          tapTimer = null;

        },
        DOUBLE_TAP_TIME
      );

  },
  {
    passive: false
  }
);


/* =========================
   pointermove
========================= */

canvas.addEventListener(
  "pointermove",
  e => {

    e.preventDefault();


    /*
      ポインター位置更新
    */

    if (
      activePointers.has(e.pointerId)
    ) {

      activePointers.get(
        e.pointerId
      ).x = e.clientX;

      activePointers.get(
        e.pointerId
      ).y = e.clientY;
    }


    /*
      ピンチ中
    */

    if (isPinching) {

      const distance =
        getPointerDistance();


      if (
        pinchStartDistance !== null &&
        distance !== null &&
        distance > 0
      ) {

        const ratio =
          distance /
          pinchStartDistance;


        scale =
          pinchStartScale *
          ratio;


        scale =
          Math.max(
            MIN_SCALE,
            Math.min(
              MAX_SCALE,
              scale
            )
          );


        draw();
      }


      return;
    }


    /*
      矢をドラッグしていない
    */

    if (!draggingShot) {
      return;
    }


    const dx =
      e.clientX -
      pointerStartX;

    const dy =
      e.clientY -
      pointerStartY;


    if (
      Math.abs(dx) > DRAG_THRESHOLD ||
      Math.abs(dy) > DRAG_THRESHOLD
    ) {

      moved = true;
    }


    /*
      ドラッグしたら
      タップ追加をキャンセル
    */

    if (moved) {

      clearTimeout(
        tapTimer
      );

      tapTimer = null;

      lastTapShot = null;
    }


    const p =
      screenToWorld(
        e.clientX +
          dragOffsetX,

        e.clientY +
          dragOffsetY
      );


    p.x =
      Math.max(
        RECORD_LEFT,
        Math.min(
          RECORD_RIGHT,
          p.x
        )
      );

    p.y =
      Math.max(
        RECORD_TOP,
        Math.min(
          RECORD_BOTTOM,
          p.y
        )
      );


    draggingShot.x =
      p.x;

    draggingShot.y =
      p.y;


    draw();

  },
  {
    passive: false
  }
);


/* =========================
   pointerup
========================= */

canvas.addEventListener(
  "pointerup",
  e => {

    e.preventDefault();


    /*
      pointerを削除
    */

    activePointers.delete(
      e.pointerId
    );


    /*
      ピンチ中
    */

    if (isPinching) {

      /*
        まだ2本以上触れているなら
        ピンチ継続
      */

      if (
        getActiveTouchPointers().length >= 2
      ) {

        return;
      }


      /*
        ピンチ終了
      */

      isPinching = false;

      pinchStartDistance = null;

      draggingShot = null;

      moved = true;


      /*
        ピンチ終了直後の
        誤タップを防止。
      */

      justFinishedPinch = true;

      cancelTap();


      setTimeout(
        () => {

          justFinishedPinch = false;

        },
        150
      );


      return;
    }


    /*
      ドラッグ終了
    */

    if (
      draggingShot &&
      moved
    ) {

      saveShots();
    }


    draggingShot =
      null;

  },
  {
    passive: false
  }
);


/* =========================
   pointercancel
========================= */

canvas.addEventListener(
  "pointercancel",
  e => {

    activePointers.delete(
      e.pointerId
    );


    cancelTap();

    draggingShot = null;

    moved = true;


    if (
      getActiveTouchPointers().length < 2
    ) {

      isPinching = false;

      pinchStartDistance = null;

      justFinishedPinch = true;


      setTimeout(
        () => {

          justFinishedPinch = false;

        },
        150
      );
    }

  }
);


/* =========================
   ダブルタップ用時刻
========================= */

let lastTapTime = 0;


/* =========================
   ズームボタン
========================= */

minusButton.addEventListener(
  "click",
  () => {

    scale /= 1.2;

    scale =
      Math.max(
        MIN_SCALE,
        scale
      );

    draw();
  }
);


plusButton.addEventListener(
  "click",
  () => {

    scale *= 1.2;

    scale =
      Math.min(
        MAX_SCALE,
        scale
      );

    draw();
  }
);


/* =========================
   リセット
========================= */

resetButton.addEventListener(
  "click",
  () => {

    const ok =
      confirm(
        dateInput.value +
        " の矢所記録を全部削除しますか？"
      );


    if (!ok) {
      return;
    }


    shots = [];

    selectedShots.clear();

    selectionMode = false;

    saveShots();

    draw();
  }
);


/* =========================
   選択モード
========================= */

selectButton.addEventListener(
  "click",
  () => {

    selectionMode = true;

    selectedShots.clear();

    selectionCycle = [];

    selectionCycleIndex = 0;

    lastSelectionX = null;
    lastSelectionY = null;

    draw();
  }
);


/* =========================
   選択削除
========================= */

deleteSelectedButton.addEventListener(
  "click",
  () => {

    if (
      selectedShots.size === 0
    ) {

      return;
    }


    const ok =
      confirm(
        selectedShots.size +
        "本の矢を削除しますか？"
      );


    if (!ok) {
      return;
    }


    const deletedNumbers =
      Array.from(
        selectedShots
      ).map(
        shot =>
          Number(shot.number)
      );


    shots =
      shots.filter(
        shot =>
          !selectedShots.has(
            shot
          )
      );


    for (const shot of shots) {

      const n =
        Number(shot.number);

      const shiftCount =
        deletedNumbers.filter(
          deletedNumber =>
            deletedNumber < n
        ).length;

      shot.number =
        n - shiftCount;
    }


    selectedShots.clear();

    saveShots();

    draw();
  }
);


/* =========================
   選択終了
========================= */

cancelSelectButton.addEventListener(
  "click",
  () => {

    selectionMode = false;

    selectedShots.clear();

    selectionCycle = [];

    selectionCycleIndex = 0;

    lastSelectionX = null;
    lastSelectionY = null;

    draw();
  }
);


/* =========================
   日付変更
========================= */

dateInput.addEventListener(
  "change",
  () => {

    selectionMode = false;

    selectedShots.clear();

    selectionCycle = [];

    selectionCycleIndex = 0;

    lastSelectionX = null;
    lastSelectionY = null;

    loadShots();

    draw();
  }
);


/* =========================
   起動
========================= */

window.addEventListener(
  "resize",
  resize
);

loadShots();

resize();

</script>
