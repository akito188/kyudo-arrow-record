<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>弓道 矢所記録</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  background: #b99668;
  font-family: sans-serif;
}

body {
  position: fixed;
  inset: 0;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* =========================
   日付
========================= */

#dateBox {
  position: fixed;
  left: 12px;
  top: 10px;
  z-index: 20;

  padding: 6px 9px;

  background: rgba(255,255,255,0.92);
  border-radius: 8px;

  font-size: 14px;
  color: #333;

  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

#dateInput {
  border: none;
  outline: none;
  background: transparent;
  font-size: 14px;
  color: #333;
}

/* =========================
   ボタン
========================= */

#buttons {
  position: fixed;
  right: 12px;
  top: 10px;
  z-index: 20;

  display: flex;
  gap: 6px;
}

button {
  border: none;
  outline: none;

  background: rgba(255,255,255,0.94);
  color: #333;

  border-radius: 8px;

  padding: 7px 10px;

  font-size: 14px;

  box-shadow: 0 1px 4px rgba(0,0,0,0.15);

  touch-action: manipulation;
}

button:active {
  transform: scale(0.96);
}

#buttons button {
  min-width: 42px;
}

/* =========================
   選択情報
========================= */

#selectionInfo {
  position: fixed;
  left: 50%;
  bottom: 54px;
  transform: translateX(-50%);

  z-index: 20;

  padding: 5px 10px;

  background: rgba(255,255,255,0.92);
  border-radius: 8px;

  font-size: 13px;
  color: #333;

  display: none;

  white-space: nowrap;
}

#selectionBar {
  position: fixed;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);

  z-index: 20;

  display: none;

  gap: 6px;
}

#selectionBar button {
  padding: 7px 12px;
}

/* =========================
   編集モーダル
========================= */

#editModal {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,0.35);
}

#editPanel {
  width: min(330px, calc(100vw - 32px));

  background: #fff;

  border-radius: 14px;

  padding: 18px;

  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

#editPanel h3 {
  margin: 0 0 14px;
  font-size: 17px;
  text-align: center;
}

#editPanel label {
  display: block;
  margin: 10px 0 5px;

  font-size: 13px;
  color: #555;
}

#editNumber {
  width: 100%;
  padding: 9px;

  border: 1px solid #ccc;
  border-radius: 7px;

  font-size: 16px;
}

#editComment {
  width: 100%;
  height: 90px;

  resize: none;

  padding: 9px;

  border: 1px solid #ccc;
  border-radius: 7px;

  font-size: 14px;

  font-family: sans-serif;
}

#editButtons {
  display: flex;
  justify-content: space-between;

  margin-top: 14px;
}

#editButtons .danger {
  background: #e53935;
  color: white;
}

#editButtons .save {
  background: #142f55;
  color: white;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="dateBox">
  <input id="dateInput" type="date">
</div>

<div id="buttons">
  <button id="resetBtn">リセット</button>
  <button id="selectBtn">選択</button>
  <button id="zoomOutBtn">−</button>
  <button id="zoomInBtn">＋</button>
</div>

<div id="selectionInfo"></div>

<div id="selectionBar">
  <button id="deleteSelectedBtn">選択削除</button>
  <button id="finishSelectBtn">終了</button>
</div>

<div id="editModal">

  <div id="editPanel">

    <h3>矢の編集</h3>

    <label for="editNumber">番号</label>
    <input id="editNumber" type="number" min="1">

    <label for="editComment">コメント</label>
    <textarea id="editComment"></textarea>

    <div id="editButtons">
      <button id="deleteEditBtn" class="danger">削除</button>
      <button id="cancelEditBtn">キャンセル</button>
      <button id="saveEditBtn" class="save">保存</button>
    </div>

  </div>

</div>

<script>

/* =========================================================
   基本設定
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const dateInput = document.getElementById("dateInput");

const resetBtn = document.getElementById("resetBtn");
const selectBtn = document.getElementById("selectBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const zoomInBtn = document.getElementById("zoomInBtn");

const selectionInfo = document.getElementById("selectionInfo");
const selectionBar = document.getElementById("selectionBar");

const deleteSelectedBtn =
  document.getElementById("deleteSelectedBtn");

const finishSelectBtn =
  document.getElementById("finishSelectBtn");

const editModal =
  document.getElementById("editModal");

const editNumber =
  document.getElementById("editNumber");

const editComment =
  document.getElementById("editComment");

const deleteEditBtn =
  document.getElementById("deleteEditBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");

const saveEditBtn =
  document.getElementById("saveEditBtn");


/* =========================================================
   元の描画設定
========================================================= */

const TARGET_SPACING = 1800;
const TARGET_DIAMETER = 360;
const TARGET_RADIUS = 180;

const GROUND_Y = 270;
const CURTAIN_Y = -900;
const AZUCHI_TOP = -330;

const RECORD_TOP = -1200;
const RECORD_BOTTOM = 600;
const RECORD_LEFT = -1800;
const RECORD_RIGHT = 1800;

const SHOT_RADIUS = 9;
const OVERLAP_RADIUS = 5.4;


/* =========================================================
   矢の色
========================================================= */

const SHOT_COLORS = [
  "#e53935",
  "#1976d2",
  "#2e9d50",
  "#f28c28",
  "#8e44ad",
  "#008b8b",
  "#d81b60",
  "#6d4c41"
];


/* =========================================================
   状態
========================================================= */

let W = 0;
let H = 0;

let scale = 1;

const MIN_SCALE = 0.4;
const MAX_SCALE = 4;

let centerY = 0;

let shots = [];

let selectedShots = new Set();

let selectionMode = false;

let editingShot = null;


/* =========================================================
   タップ・ドラッグ状態
========================================================= */

let draggingShot = null;

let pointerDownX = 0;
let pointerDownY = 0;

let pointerMoved = false;

let pointerDownTime = 0;

const MOVE_THRESHOLD = 8;


/* =========================================================
   ダブルタップ状態
========================================================= */

let lastTapShot = null;
let lastTapTime = 0;

const DOUBLE_TAP_TIME = 450;


/* =========================================================
   空白タップ保留
========================================================= */

let tapTimer = null;

let pendingTapX = null;
let pendingTapY = null;


/* =========================================================
   ピンチ
========================================================= */

let isPinching = false;

let pinchStartDistance = 0;
let pinchStartScale = 1;

let activePointers = new Map();


/* =========================================================
   重なりタップ状態
========================================================= */

let lastOverlapShots = [];

let lastOverlapIndex = -1;

let lastOverlapX = 0;
let lastOverlapY = 0;

let lastOverlapTime = 0;

const OVERLAP_CYCLE_TIME = 700;


/* =========================================================
   日付
========================================================= */

function todayString() {

  const d = new Date();

  const y = d.getFullYear();

  const m =
    String(d.getMonth() + 1).padStart(2, "0");

  const day =
    String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

dateInput.value = todayString();


/* =========================================================
   保存
========================================================= */

function storageKey() {
  return "kyudo_" + dateInput.value;
}


function saveShots() {

  localStorage.setItem(
    storageKey(),
    JSON.stringify(shots)
  );
}


/* =========================================================
   読み込み
========================================================= */

function loadShots() {

  const raw =
    localStorage.getItem(storageKey());

  if (!raw) {

    shots = [];

    return;
  }

  try {

    const data = JSON.parse(raw);

    if (!Array.isArray(data)) {

      shots = [];

      return;
    }

    shots = data.map((shot, index) => {

      return {
        x: Number(shot.x) || 0,
        y: Number(shot.y) || 0,

        number:
          Number.isFinite(Number(shot.number))
            ? Number(shot.number)
            : index + 1,

        comment:
          typeof shot.comment === "string"
            ? shot.comment
            : ""
      };

    });

  } catch {

    shots = [];
  }

  selectedShots.clear();

  lastTapShot = null;

  lastOverlapShots = [];

  lastOverlapIndex = -1;
}


/* =========================================================
   Canvasサイズ
========================================================= */

function resizeCanvas() {

  const dpr =
    Math.max(1, window.devicePixelRatio || 1);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  draw();
}

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   論理的な横画面
========================================================= */

/*
   iPhoneを縦画面として認識していても、
   アプリ内部では「横画面」を基準にする。

   ここが今回の重要部分。

   canvasそのものをCSS transformで回転させない。
   座標系だけを -90° 相当にする。
*/


function isPortraitViewport() {

  return W < H;
}


function logicalWidth() {

  return isPortraitViewport()
    ? H
    : W;
}


function logicalHeight() {

  return isPortraitViewport()
    ? W
    : H;
}


/*
   論理画面 → 実際のcanvas画面
*/

function logicalToPhysical(x, y) {

  if (!isPortraitViewport()) {

    return {
      x,
      y
    };
  }

  return {
    x: y,
    y: logicalWidth() - x
  };
}


/*
   実際のcanvas画面 → 論理画面
*/

function physicalToLogical(x, y) {

  if (!isPortraitViewport()) {

    return {
      x,
      y
    };
  }

  return {
    x: logicalWidth() - y,
    y: x
  };
}


/* =========================================================
   拡大率
========================================================= */

function baseScale() {

  const lw = logicalWidth();
  const lh = logicalHeight();

  return Math.min(
    lw / 1200,
    lh / 700
  );
}


/* =========================================================
   ワールド座標 → 論理画面座標
========================================================= */

function worldToLogicalScreen(x, y) {

  const s =
    baseScale() * scale;

  return {

    x:
      logicalWidth() / 2
      + x * s,

    y:
      logicalHeight() / 2
      + (y - centerY) * s

  };
}


/* =========================================================
   ワールド座標 → 実画面座標
========================================================= */

function worldToScreen(x, y) {

  const logical =
    worldToLogicalScreen(x, y);

  return logicalToPhysical(
    logical.x,
    logical.y
  );
}


/* =========================================================
   実画面座標 → ワールド座標
========================================================= */

function screenToWorld(x, y) {

  const logical =
    physicalToLogical(x, y);

  const s =
    baseScale() * scale;

  return {

    x:
      (logical.x - logicalWidth() / 2)
      / s,

    y:
      (logical.y - logicalHeight() / 2)
      / s
      + centerY

  };
}


/* =========================================================
   論理画面での描画
========================================================= */

function drawLogical(callback) {

  if (!isPortraitViewport()) {

    callback();

    return;
  }

  /*
     canvasを回転させるのではなく、
     描画座標だけを論理座標から実座標へ変換する。

     callback内では論理座標を使う。
  */

  ctx.save();

  /*
     xLogical → yPhysical
     yLogical → width - xPhysical

     つまり論理画面を -90° 相当に配置。
  */

  ctx.translate(
    0,
    logicalWidth()
  );

  ctx.rotate(-Math.PI / 2);

  callback();

  ctx.restore();
}


/* =========================================================
   背景
========================================================= */

function drawBackground() {

  /*
     背景色は元のまま。
  */

  ctx.fillStyle = "#b99668";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* =========================================================
   ワールド背景
========================================================= */

function drawWorldBackground() {

  const lw = logicalWidth();
  const lh = logicalHeight();

  /*
     論理画面上で背景を描く。
     ここも勝手に色や位置を変えない。
  */

  ctx.save();

  /*
     論理座標系へ移動
  */

  ctx.translate(
    lw / 2,
    lh / 2
  );

  const s =
    baseScale() * scale;

  ctx.scale(s, s);

  ctx.translate(
    0,
    -centerY
  );


  /* -------------------------
     紺の幕
  ------------------------- */

  ctx.fillStyle = "#142f55";

  ctx.fillRect(
    -5000,
    CURTAIN_Y,
    10000,
    AZUCHI_TOP - CURTAIN_Y
  );


  /* -------------------------
     安土
  ------------------------- */

  ctx.fillStyle = "#b99668";

  ctx.fillRect(
    -5000,
    AZUCHI_TOP,
    10000,
    5000
  );


  /* -------------------------
     地面
  ------------------------- */

  ctx.strokeStyle = "#705335";
  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.moveTo(
    -5000,
    GROUND_Y
  );

  ctx.lineTo(
    5000,
    GROUND_Y
  );

  ctx.stroke();


  /* -------------------------
     記録範囲の点線
  ------------------------- */

  ctx.save();

  ctx.strokeStyle =
    "rgba(112,83,53,0.35)";

  ctx.lineWidth = 2;

  ctx.setLineDash([20, 20]);

  ctx.strokeRect(
    RECORD_LEFT,
    RECORD_TOP,
    RECORD_RIGHT - RECORD_LEFT,
    RECORD_BOTTOM - RECORD_TOP
  );

  ctx.restore();


  ctx.restore();
}


/* =========================================================
   的
========================================================= */

function drawTargetAt(x, y) {

  const p =
    worldToLogicalScreen(x, y);

  /*
     worldToLogicalScreenは論理画面なので、
     portraitの場合はここでさらに
     論理→物理へ変換。
  */

  const physical =
    logicalToPhysical(p.x, p.y);

  const s =
    baseScale() * scale;

  const radius =
    TARGET_RADIUS * s;


  ctx.save();

  ctx.beginPath();

  ctx.arc(
    physical.x,
    physical.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#f7f1df";
  ctx.fill();

  ctx.strokeStyle = "#333";
  ctx.lineWidth = 2;

  ctx.stroke();


  /*
     的の同心円
  */

  const rings = [
    1,
    0.8,
    0.6,
    0.4,
    0.2
  ];

  for (const r of rings) {

    ctx.beginPath();

    ctx.arc(
      physical.x,
      physical.y,
      radius * r,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1;

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   全ての的
========================================================= */

function drawTargets() {

  /*
     元の横方向の的配置。
  */

  drawTargetAt(
    -TARGET_SPACING,
    0
  );

  drawTargetAt(
    0,
    0
  );

  drawTargetAt(
    TARGET_SPACING,
    0
  );
}


/* =========================================================
   矢
========================================================= */

function drawShot(shot) {

  const p =
    worldToScreen(
      shot.x,
      shot.y
    );

  const r =
    Math.max(
      3,
      SHOT_RADIUS *
      baseScale() *
      scale
    );

  const index =
    Math.max(
      0,
      Number(shot.number || 1) - 1
    );

  const color =
    SHOT_COLORS[
      index % SHOT_COLORS.length
    ];


  /*
     選択モード
  */

  const isSelected =
    selectedShots.has(shot);


  /* -------------------------
     円
  ------------------------- */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = color;

  ctx.fill();


  if (isSelected) {

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      r + 5,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 3;

    ctx.stroke();
  }


  /* -------------------------
     番号
  ------------------------- */

  /*
     ここも論理画面の向きに合わせて -90°。

     スマホで見たとき、
     的や矢所と同じ向きになる。
  */

  ctx.translate(
    p.x,
    p.y
  );

  ctx.rotate(-Math.PI / 2);

  ctx.fillStyle = "#ffffff";

  ctx.font =
    "bold 10px sans-serif";

  ctx.textAlign = "center";

  ctx.textBaseline = "middle";

  ctx.fillText(
    shot.number,
    0,
    0.5
  );

  ctx.restore();
}


/* =========================================================
   描画
========================================================= */

function draw() {

  if (!W || !H) return;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawWorldBackground();

  drawTargets();


  /*
     矢は重なったときに、
     後ろの矢も確認できるようにする。

     配列順はそのまま。
  */

  for (const shot of shots) {

    drawShot(shot);
  }

  updateSelectionUI();
}


/* =========================================================
   矢の番号を正規化
========================================================= */

function normalizeNumbers() {

  /*
     元の番号を維持する。

     削除時だけ必要なら詰める。
  */

  shots.forEach((shot, index) => {

    if (
      !Number.isFinite(
        Number(shot.number)
      )
    ) {

      shot.number = index + 1;
    }

  });
}


/* =========================================================
   新しい矢
========================================================= */

function addShot(x, y) {

  const maxNumber =
    shots.reduce(
      (max, shot) =>
        Math.max(
          max,
          Number(shot.number) || 0
        ),
      0
    );

  const shot = {

    x,
    y,

    number:
      maxNumber + 1,

    comment: ""
  };

  shots.push(shot);

  saveShots();

  draw();
}


/* =========================================================
   タップ位置にある矢
========================================================= */

function getShotsAtScreenPoint(
  screenX,
  screenY
) {

  const world =
    screenToWorld(
      screenX,
      screenY
    );

  const hitRadius =
    OVERLAP_RADIUS /
    (baseScale() * scale);


  /*
     近い矢を全部取得。
  */

  const hits = [];

  for (const shot of shots) {

    const dx =
      shot.x - world.x;

    const dy =
      shot.y - world.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    /*
       実際の矢の円も考慮。
    */

    const allowed =
      Math.max(
        hitRadius,
        SHOT_RADIUS /
          (baseScale() * scale)
      );

    if (distance <= allowed) {

      hits.push(shot);
    }
  }

  /*
     描画上手前のものを先に。
  */

  hits.reverse();

  return hits;
}


/* =========================================================
   重なり選択
========================================================= */

function chooseOverlapShot(
  hits,
  x,
  y
) {

  if (hits.length === 0) {

    lastOverlapShots = [];

    lastOverlapIndex = -1;

    return null;
  }


  const now =
    Date.now();


  /*
     同じ場所を短時間にタップした場合、
     重なっている矢を順番に切り替える。
  */

  const sameGroup =
    hits.length ===
      lastOverlapShots.length
    &&
    hits.every(
      shot =>
        lastOverlapShots.includes(shot)
    )
    &&
    Math.hypot(
      x - lastOverlapX,
      y - lastOverlapY
    ) < 20
    &&
    now - lastOverlapTime
      < OVERLAP_CYCLE_TIME;


  if (sameGroup) {

    lastOverlapIndex =
      (lastOverlapIndex + 1)
      % hits.length;

  } else {

    lastOverlapShots =
      [...hits];

    lastOverlapIndex = 0;
  }


  lastOverlapShots =
    [...hits];

  lastOverlapX = x;
  lastOverlapY = y;
  lastOverlapTime = now;


  return hits[lastOverlapIndex];
}


/* =========================================================
   選択UI
========================================================= */

function updateSelectionUI() {

  if (!selectionMode) {

    selectionInfo.style.display =
      "none";

    selectionBar.style.display =
      "none";

    return;
  }


  selectionInfo.style.display =
    "block";

  selectionBar.style.display =
    "flex";

  selectionInfo.textContent =
    `${selectedShots.size}本選択中`;
}


/* =========================================================
   保留中のタップをキャンセル
========================================================= */

function cancelPendingTap() {

  if (tapTimer !== null) {

    clearTimeout(tapTimer);

    tapTimer = null;
  }

  pendingTapX = null;
  pendingTapY = null;
}


/* =========================================================
   空白タップ
========================================================= */

function scheduleEmptyTap(
  x,
  y
) {

  cancelPendingTap();

  pendingTapX = x;
  pendingTapY = y;


  tapTimer =
    setTimeout(() => {

      tapTimer = null;

      if (isPinching) {

        pendingTapX = null;
        pendingTapY = null;

        return;
      }

      if (
        pendingTapX === null ||
        pendingTapY === null
      ) {

        return;
      }


      addShot(
        pendingTapX,
        pendingTapY
      );


      pendingTapX = null;
      pendingTapY = null;

    }, DOUBLE_TAP_TIME);
}


/* =========================================================
   既存矢のタップ
========================================================= */

function handleShotTap(
  shot,
  x,
  y
) {

  const now =
    Date.now();


  /*
     ダブルタップなら編集。
  */

  if (
    lastTapShot === shot &&
    now - lastTapTime
      <= DOUBLE_TAP_TIME
  ) {

    cancelPendingTap();

    lastTapShot = null;

    lastOverlapShots = [];

    lastOverlapIndex = -1;

    openEditShot(shot);

    return;
  }


  /*
     既存の矢をタップした場合、
     その場で新しい矢を作らない。

     一度目のタップを記憶。
  */

  cancelPendingTap();

  lastTapShot = shot;

  lastTapTime = now;


  /*
     重なっている場合は、
     選択対象を切り替える。
  */

  const hits =
    getShotsAtScreenPoint(
      x,
      y
    );


  if (hits.length > 1) {

    const selected =
      chooseOverlapShot(
        hits,
        x,
        y
      );

    if (selected) {

      if (selectionMode) {

        toggleSelection(selected);
      }

    }

  } else {

    lastOverlapShots = [];

    lastOverlapIndex = -1;

    if (selectionMode) {

      toggleSelection(shot);
    }
  }


  draw();
}


/* =========================================================
   選択切り替え
========================================================= */

function toggleSelection(shot) {

  if (
    selectedShots.has(shot)
  ) {

    selectedShots.delete(shot);

  } else {

    selectedShots.add(shot);
  }

  updateSelectionUI();

  draw();
}


/* =========================================================
   編集画面
========================================================= */

function openEditShot(shot) {

  editingShot = shot;

  editNumber.value =
    shot.number;

  editComment.value =
    shot.comment || "";

  editModal.style.display =
    "flex";
}


function closeEditModal() {

  editModal.style.display =
    "none";

  editingShot = null;
}


/* =========================================================
   編集保存
========================================================= */

saveEditBtn.addEventListener(
  "click",
  () => {

    if (!editingShot) return;


    const newNumber =
      Number(editNumber.value);


    if (
      Number.isFinite(newNumber) &&
      newNumber > 0
    ) {

      editingShot.number =
        Math.floor(newNumber);
    }


    editingShot.comment =
      editComment.value;


    saveShots();

    closeEditModal();

    draw();
  }
);


/* =========================================================
   編集キャンセル
========================================================= */

cancelEditBtn.addEventListener(
  "click",
  () => {

    closeEditModal();
  }
);


/* =========================================================
   編集削除
========================================================= */

deleteEditBtn.addEventListener(
  "click",
  () => {

    if (!editingShot) return;


    const index =
      shots.indexOf(editingShot);


    if (index !== -1) {

      shots.splice(index, 1);
    }


    selectedShots.delete(
      editingShot
    );


    saveShots();

    closeEditModal();

    draw();
  }
);


/* =========================================================
   モーダル外タップ
========================================================= */

editModal.addEventListener(
  "pointerdown",
  e => {

    if (
      e.target === editModal
    ) {

      closeEditModal();
    }
  }
);


/* =========================================================
   Pointer Down
========================================================= */

canvas.addEventListener(
  "pointerdown",
  e => {

    /*
       ポインタを登録
    */

    activePointers.set(
      e.pointerId,
      {
        x: e.clientX,
        y: e.clientY
      }
    );


    /*
       2本目の指
    */

    if (
      activePointers.size >= 2
    ) {

      isPinching = true;

      draggingShot = null;

      pointerMoved = true;

      cancelPendingTap();

      lastTapShot = null;

      const points =
        [...activePointers.values()];

      pinchStartDistance =
        Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );

      pinchStartScale =
        scale;

      return;
    }


    /*
       編集モーダルが開いている場合
    */

    if (
      editModal.style.display === "flex"
    ) {

      return;
    }


    pointerDownX =
      e.clientX;

    pointerDownY =
      e.clientY;

    pointerDownTime =
      Date.now();

    pointerMoved = false;


    /*
       既存矢の判定
    */

    const hits =
      getShotsAtScreenPoint(
        e.clientX,
        e.clientY
      );


    if (hits.length > 0) {

      /*
         重なりがあれば順番選択。
      */

      const shot =
        chooseOverlapShot(
          hits,
          e.clientX,
          e.clientY
        );


      if (shot) {

        draggingShot = shot;

        return;
      }
    }


    /*
       空白。
       ここではまだaddShotしない。

       これがピンチ開始時に
       勝手に矢が増える問題の修正。
    */

    draggingShot = null;

    scheduleEmptyTap(
      e.clientX,
      e.clientY
    );
  }
);


/* =========================================================
   Pointer Move
========================================================= */

canvas.addEventListener(
  "pointermove",
  e => {

    /*
       ポインタ位置更新
    */

    if (
      activePointers.has(
        e.pointerId
      )
    ) {

      activePointers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );
    }


    /*
       ピンチ
    */

    if (
      isPinching &&
      activePointers.size >= 2
    ) {

      const points =
        [...activePointers.values()];

      const distance =
        Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );


      if (
        pinchStartDistance > 0
      ) {

        const ratio =
          distance /
          pinchStartDistance;

        scale =
          Math.min(
            MAX_SCALE,
            Math.max(
              MIN_SCALE,
              pinchStartScale * ratio
            )
          );

        draw();
      }

      return;
    }


    /*
       移動量
    */

    const dx =
      e.clientX - pointerDownX;

    const dy =
      e.clientY - pointerDownY;

    if (
      Math.hypot(dx, dy)
      > MOVE_THRESHOLD
    ) {

      pointerMoved = true;

      /*
         空白タップをキャンセル。

         指をスライドしただけで
         矢が追加されないようにする。
      */

      cancelPendingTap();

      lastTapShot = null;
    }


    /*
       矢をドラッグ
    */

    if (
      draggingShot &&
      !isPinching
    ) {

      const world =
        screenToWorld(
          e.clientX,
          e.clientY
        );

      draggingShot.x =
        world.x;

      draggingShot.y =
        world.y;

      saveShots();

      draw();
    }
  }
);


/* =========================================================
   Pointer Up
========================================================= */

canvas.addEventListener(
  "pointerup",
  e => {

    activePointers.delete(
      e.pointerId
    );


    /*
       ピンチ終了
    */

    if (
      activePointers.size < 2
    ) {

      if (isPinching) {

        isPinching = false;

        draggingShot = null;

        pointerMoved = true;

        cancelPendingTap();

        lastTapShot = null;

        draw();

        return;
      }
    }


    /*
       ドラッグ終了
    */

    if (draggingShot) {

      if (
        pointerMoved
      ) {

        saveShots();
      }

      draggingShot = null;

      draw();

      return;
    }


    /*
       指を動かして終了した場合
    */

    if (pointerMoved) {

      cancelPendingTap();

      return;
    }


    /*
       空白タップはすでに
       scheduleEmptyTap() で処理中。

       ここでは追加しない。
    */
  }
);


/* =========================================================
   Pointer Cancel
========================================================= */

canvas.addEventListener(
  "pointercancel",
  e => {

    activePointers.delete(
      e.pointerId
    );

    draggingShot = null;

    pointerMoved = true;

    cancelPendingTap();

    lastTapShot = null;

    if (
      activePointers.size < 2
    ) {

      isPinching = false;
    }

    draw();
  }
);


/* =========================================================
   マウス・タッチの取りこぼし防止
========================================================= */

canvas.addEventListener(
  "lostpointercapture",
  e => {

    activePointers.delete(
      e.pointerId
    );
  }
);


/* =========================================================
   touchstart
   iPhone/Safari対策
========================================================= */

canvas.addEventListener(
  "touchstart",
  e => {

    if (
      e.touches.length >= 2
    ) {

      isPinching = true;

      draggingShot = null;

      pointerMoved = true;

      cancelPendingTap();

      lastTapShot = null;
    }

  },
  {
    passive: true
  }
);


/* =========================================================
   選択ボタン
========================================================= */

selectBtn.addEventListener(
  "click",
  () => {

    selectionMode =
      !selectionMode;


    if (!selectionMode) {

      selectedShots.clear();
    }


    updateSelectionUI();

    draw();
  }
);


/* =========================================================
   選択削除
========================================================= */

deleteSelectedBtn.addEventListener(
  "click",
  () => {

    if (
      selectedShots.size === 0
    ) {

      return;
    }


    shots =
      shots.filter(
        shot =>
          !selectedShots.has(shot)
      );


    selectedShots.clear();

    saveShots();

    draw();
  }
);


/* =========================================================
   選択終了
========================================================= */

finishSelectBtn.addEventListener(
  "click",
  () => {

    selectionMode = false;

    selectedShots.clear();

    updateSelectionUI();

    draw();
  }
);


/* =========================================================
   ズーム
========================================================= */

zoomInBtn.addEventListener(
  "click",
  () => {

    scale =
      Math.min(
        MAX_SCALE,
        scale * 1.2
      );

    draw();
  }
);


zoomOutBtn.addEventListener(
  "click",
  () => {

    scale =
      Math.max(
        MIN_SCALE,
        scale / 1.2
      );

    draw();
  }
);


/* =========================================================
   リセット
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    const ok =
      confirm(
        "この日の矢所記録をすべて削除しますか？"
      );


    if (!ok) return;


    shots = [];

    selectedShots.clear();

    lastTapShot = null;

    lastOverlapShots = [];

    lastOverlapIndex = -1;

    cancelPendingTap();

    saveShots();

    draw();
  }
);


/* =========================================================
   日付変更
========================================================= */

dateInput.addEventListener(
  "change",
  () => {

    selectionMode = false;

    selectedShots.clear();

    lastTapShot = null;

    lastOverlapShots = [];

    lastOverlapIndex = -1;

    cancelPendingTap();

    loadShots();

    draw();
  }
);


/* =========================================================
   キーボード入力対策
========================================================= */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Escape"
    ) {

      if (
        editModal.style.display === "flex"
      ) {

        closeEditModal();

      } else if (
        selectionMode
      ) {

        selectionMode = false;

        selectedShots.clear();

        updateSelectionUI();

        draw();
      }
    }
  }
);


/* =========================================================
   初期化
========================================================= */

loadShots();

resizeCanvas();

draw();

</script>

</body>
</html>
