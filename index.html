<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>弓道 矢所記録</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #b99668;
  font-family: sans-serif;
  touch-action: none;
}

/* =========================================================
   アプリ全体
   iPhoneは縦向きのまま使い、アプリそのものを -90°回転
   ========================================================= */

#app {
  position: fixed;

  width: 100vh;
  height: 100vw;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-90deg);

  transform-origin: center center;

  overflow: hidden;
  background: #b99668;
}

/* =========================================================
   Canvas
   ========================================================= */

canvas {
  position: absolute;
  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  display: block;

  touch-action: none;
}

/* =========================================================
   日付
   ========================================================= */

#dateBox {
  position: absolute;

  top: 12px;
  left: 12px;

  z-index: 10;

  background: rgba(255,255,255,0.92);

  padding: 7px 9px;

  border-radius: 7px;

  box-shadow:
    0 1px 4px rgba(0,0,0,0.25);
}

#dateInput {
  border: none;
  background: transparent;

  font-size: 15px;
  font-weight: bold;

  outline: none;
}

/* =========================================================
   ボタン
   ========================================================= */

#buttons {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 10;

  display: flex;
  gap: 6px;
}

button {
  border: none;

  padding: 8px 12px;

  border-radius: 7px;

  background: rgba(255,255,255,0.92);

  font-size: 14px;

  box-shadow:
    0 1px 4px rgba(0,0,0,0.25);
}

button:active {
  transform: scale(0.96);
}

/* =========================================================
   選択表示
   ========================================================= */

#selection {
  position: absolute;

  left: 50%;
  bottom: 12px;

  transform: translateX(-50%);

  z-index: 10;

  display: none;

  background: rgba(255,255,255,0.94);

  padding: 8px 12px;

  border-radius: 8px;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.25);

  font-size: 14px;
}

/* =========================================================
   コメント入力モーダル
   ========================================================= */

#modal {
  position: absolute;

  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,0.35);
}

#modalBox {
  width: min(320px, 80%);

  background: white;

  padding: 16px;

  border-radius: 10px;

  box-shadow:
    0 4px 20px rgba(0,0,0,0.35);
}

#commentInput {
  width: 100%;

  min-height: 80px;

  resize: none;

  border: 1px solid #bbb;

  border-radius: 6px;

  padding: 8px;

  font-size: 15px;

  outline: none;
}

#modalButtons {
  display: flex;

  justify-content: flex-end;

  gap: 7px;

  margin-top: 10px;
}
</style>
</head>

<body>

<div id="app">

  <canvas id="canvas"></canvas>

  <!-- 日付 -->
  <div id="dateBox">
    <input type="date" id="dateInput">
  </div>

  <!-- ボタン -->
  <div id="buttons">
    <button id="resetBtn">リセット</button>
  </div>

  <!-- 選択表示 -->
  <div id="selection"></div>

  <!-- コメント入力 -->
  <div id="modal">
    <div id="modalBox">

      <textarea
        id="commentInput"
        placeholder="コメント（任意）"
      ></textarea>

      <div id="modalButtons">
        <button id="cancelBtn">キャンセル</button>
        <button id="saveBtn">保存</button>
      </div>

    </div>
  </div>

</div>

<script>
"use strict";

/* =========================================================
   基本設定
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const app = document.getElementById("app");

const dateInput = document.getElementById("dateInput");
const resetBtn = document.getElementById("resetBtn");

const selection = document.getElementById("selection");

const modal = document.getElementById("modal");
const commentInput = document.getElementById("commentInput");

const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");


/* =========================================================
   弓道場・的の設定
   ========================================================= */

const TARGET_SPACING = 1800;

const TARGET_DIAMETER = 360;
const TARGET_RADIUS = TARGET_DIAMETER / 2;

const SHOT_RADIUS = 9;
const OVERLAP_RADIUS = SHOT_RADIUS * 0.6;


/* =========================================================
   背景のワールド座標
   ========================================================= */

const GROUND_Y = 270;

const CURTAIN_Y = -900;

const AZUCHI_TOP = -330;


/* =========================================================
   記録領域
   ========================================================= */

const RECORD_TOP = -1200;
const RECORD_BOTTOM = 600;

const RECORD_LEFT = -1800;
const RECORD_RIGHT = 1800;


/* =========================================================
   Canvasサイズ
   ========================================================= */

/*
  物理的にはiPhoneを横向きに持つが、
  画面そのものは縦向き状態。

  内部座標では

    W = 元の画面の高さ
    H = 元の画面の幅

  とする。

  最後に #app 全体を -90° 回転する。
*/

let W = 0;
let H = 0;


/* =========================================================
   ズーム・パン
   ========================================================= */

let scale = 1;

const MIN_SCALE = 0.4;
const MAX_SCALE = 4;

let centerY = 0;


/* =========================================================
   データ
   ========================================================= */

let shots = [];

let selectedShotIndex = -1;


/* =========================================================
   ピンチ操作
   ========================================================= */

let isPinching = false;

let pinchStartDistance = 0;
let pinchStartScale = 1;

let tapTimer = null;


/* =========================================================
   日付
   ========================================================= */

function getTodayString() {
  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

dateInput.value = getTodayString();


/* =========================================================
   LocalStorage
   ========================================================= */

function storageKey() {
  return "kyudo_" + dateInput.value;
}


function loadData() {
  try {
    const raw = localStorage.getItem(storageKey());

    if (raw) {
      shots = JSON.parse(raw);
    } else {
      shots = [];
    }

  } catch (e) {
    console.error(e);
    shots = [];
  }

  selectedShotIndex = -1;

  updateSelection();

  draw();
}


function saveData() {
  localStorage.setItem(
    storageKey(),
    JSON.stringify(shots)
  );
}


/* =========================================================
   Canvasサイズ
   ========================================================= */

function resizeCanvas() {

  /*
    CSSで #app は

      width  = 100vh
      height = 100vw

    になっている。

    したがって内部Canvasは

      W = innerHeight
      H = innerWidth

    とする。
  */

  W = window.innerHeight;
  H = window.innerWidth;

  canvas.width = W;
  canvas.height = H;

  draw();
}


/* =========================================================
   基本スケール
   ========================================================= */

function baseScale() {

  /*
    的3枚を

      左 ─ 中央 ─ 右

    に並べたとき、

      1800 × 2 = 3600

    が画面横幅いっぱいになるようにする。

    内部座標では的がY方向に並んでいるため、
    Hを基準にする。
  */

  return H / (TARGET_SPACING * 2);
}


/* =========================================================
   ワールド → Canvas座標
   ========================================================= */

function worldToScreen(x, y) {

  const s = baseScale() * scale;

  return {
    x: W / 2 + x * s,
    y: H / 2 + (y - centerY) * s
  };
}


/* =========================================================
   Canvas → ワールド
   ========================================================= */

function screenToWorld(x, y) {

  const s = baseScale() * scale;

  return {
    x: (x - W / 2) / s,
    y: (y - H / 2) / s + centerY
  };
}


/* =========================================================
   物理画面座標 → 内部Canvas座標
   ========================================================= */

function physicalToCanvas(clientX, clientY) {

  /*
    #app全体が -90° 回転しているので、
    タッチ座標も逆変換する。

    iPhoneを横向きに持ったとき、

      physical X → internal Y
      physical Y → internal X

    となる。
  */

  return {
    x: clientY,
    y: window.innerWidth - clientX
  };
}


/* =========================================================
   的
   ========================================================= */

function drawKasumi(x, y) {

  const p = worldToScreen(x, y);

  const r = TARGET_RADIUS * baseScale() * scale;

  ctx.save();

  /*
    的の外側
  */

  ctx.beginPath();
  ctx.arc(
    p.x,
    p.y,
    r,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#f7f2df";
  ctx.fill();

  ctx.strokeStyle = "#222";
  ctx.lineWidth = Math.max(1, 1.5 * scale);
  ctx.stroke();


  /*
    的の黒円
  */

  ctx.beginPath();
  ctx.arc(
    p.x,
    p.y,
    r * 0.5,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#111";
  ctx.fill();


  /*
    中心
  */

  ctx.beginPath();
  ctx.arc(
    p.x,
    p.y,
    r * 0.15,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#111";
  ctx.fill();

  ctx.restore();
}


/* =========================================================
   背景のワールド座標描画
   ========================================================= */

function drawWorldBand(y1, y2, color) {

  /*
    Canvas画面の左右端に対応する
    ワールド座標を求める。

    これによって背景も的と同じ
    ワールド座標系に入る。
  */

  const left = screenToWorld(0, 0);
  const right = screenToWorld(W, 0);

  const p1 = worldToScreen(left.x, y1);
  const p2 = worldToScreen(right.x, y1);

  const p3 = worldToScreen(right.x, y2);
  const p4 = worldToScreen(left.x, y2);

  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(p3.x, p3.y);
  ctx.lineTo(p4.x, p4.y);

  ctx.closePath();

  ctx.fill();
}


/* =========================================================
   背景
   ========================================================= */

function drawBackground() {

  /*
    まず全体を安土色にする。
  */

  ctx.fillStyle = "#b99668";
  ctx.fillRect(0, 0, W, H);


  /*
    紺色の幕

    世界座標で

      -∞ ～ CURTAIN_Y

    の領域。
  */

  drawWorldBand(
    -100000,
    CURTAIN_Y,
    "#142f55"
  );


  /*
    安土

    AZUCHI_TOPより下。
  */

  drawWorldBand(
    AZUCHI_TOP,
    100000,
    "#b99668"
  );


  /*
    地面の境界線
  */

  const leftWorld = screenToWorld(0, 0);
  const rightWorld = screenToWorld(W, 0);

  const groundLeft =
    worldToScreen(leftWorld.x, GROUND_Y);

  const groundRight =
    worldToScreen(rightWorld.x, GROUND_Y);

  ctx.strokeStyle = "#705335";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    groundLeft.x,
    groundLeft.y
  );

  ctx.lineTo(
    groundRight.x,
    groundRight.y
  );

  ctx.stroke();


  /*
    的と的の間の点線

      -900
      +900

    をワールド座標として描く。

    これも #app の -90° 回転に
    一緒についてくる。
  */

  ctx.strokeStyle =
    "rgba(255,255,255,0.55)";

  ctx.lineWidth = 1;

  ctx.setLineDash([4, 5]);

  for (const y of [-900, 900]) {

    const p1 =
      worldToScreen(leftWorld.x, y);

    const p2 =
      worldToScreen(rightWorld.x, y);

    ctx.beginPath();

    ctx.moveTo(
      p1.x,
      p1.y
    );

    ctx.lineTo(
      p2.x,
      p2.y
    );

    ctx.stroke();
  }

  ctx.setLineDash([]);
}


/* =========================================================
   矢
   ========================================================= */

function drawShot(shot, index) {

  const p = worldToScreen(
    shot.x,
    shot.y
  );

  const r =
    SHOT_RADIUS *
    Math.max(0.7, Math.min(scale, 2));

  ctx.save();


  /*
    選択中の矢
  */

  if (index === selectedShotIndex) {

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      r + 5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(255,215,0,0.35)";

    ctx.fill();
  }


  /*
    矢の点
  */

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#d62828";

  ctx.fill();

  ctx.strokeStyle = "#fff";

  ctx.lineWidth = 1;

  ctx.stroke();


  /*
    矢番号
  */

  ctx.fillStyle = "#fff";

  ctx.font =
    `bold ${Math.max(10, r * 1.6)}px sans-serif`;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    shot.number,
    p.x,
    p.y
  );

  ctx.restore();
}


/* =========================================================
   描画
   ========================================================= */

function draw() {

  if (!W || !H) return;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    背景
  */

  drawBackground();


  /*
    的

    内部座標では縦に3枚並べる。

    #appが -90° 回転するため、
    実際のiPhone画面では

      左 ─ 中央 ─ 右

    になる。
  */

  drawKasumi(0, 1800);
  drawKasumi(0, 0);
  drawKasumi(0, -1800);


  /*
    矢
  */

  shots.forEach(
    (shot, index) => {
      drawShot(shot, index);
    }
  );
}


/* =========================================================
   矢の番号
   ========================================================= */

function nextShotNumber() {

  if (shots.length === 0) {
    return 1;
  }

  return Math.max(
    ...shots.map(
      s => Number(s.number) || 0
    )
  ) + 1;
}


/* =========================================================
   タップ位置から既存の矢を探す
   ========================================================= */

function findShotAt(x, y) {

  const w = screenToWorld(x, y);

  const hitRadius =
    OVERLAP_RADIUS /
    (baseScale() * scale);

  let nearest = -1;
  let nearestDistance = Infinity;

  shots.forEach((shot, index) => {

    const dx = shot.x - w.x;
    const dy = shot.y - w.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);

    if (
      distance <= hitRadius &&
      distance < nearestDistance
    ) {
      nearest = index;
      nearestDistance = distance;
    }
  });

  return nearest;
}


/* =========================================================
   矢を追加
   ========================================================= */

function addShot(x, y) {

  /*
    ピンチ操作中は絶対に追加しない。
  */

  if (isPinching) {
    return;
  }

  const w = screenToWorld(x, y);

  const shot = {
    x: w.x,
    y: w.y,
    number: nextShotNumber(),
    comment: ""
  };

  shots.push(shot);

  selectedShotIndex =
    shots.length - 1;

  saveData();

  updateSelection();

  draw();
}


/* =========================================================
   矢を選択
   ========================================================= */

function selectShot(index) {

  if (
    index < 0 ||
    index >= shots.length
  ) {
    return;
  }

  selectedShotIndex = index;

  updateSelection();

  draw();

  /*
    コメント入力
  */

  commentInput.value =
    shots[index].comment || "";

  modal.style.display = "flex";
}


/* =========================================================
   選択表示
   ========================================================= */

function updateSelection() {

  if (
    selectedShotIndex < 0 ||
    selectedShotIndex >= shots.length
  ) {

    selection.style.display = "none";

    return;
  }

  const shot =
    shots[selectedShotIndex];

  selection.textContent =
    `矢 ${shot.number}`;

  selection.style.display = "block";
}


/* =========================================================
   モーダルを閉じる
   ========================================================= */

function closeModal() {

  modal.style.display = "none";

  selectedShotIndex = -1;

  updateSelection();

  draw();
}


/* =========================================================
   タップ処理
   ========================================================= */

function handleTap(clientX, clientY) {

  if (isPinching) {
    return;
  }

  const p =
    physicalToCanvas(
      clientX,
      clientY
    );

  /*
    既存の矢をタップした場合
  */

  const existing =
    findShotAt(
      p.x,
      p.y
    );

  if (existing >= 0) {

    selectShot(existing);

    return;
  }


  /*
    新しい矢
  */

  addShot(
    p.x,
    p.y
  );
}


/* =========================================================
   Pointer Events
   ========================================================= */

canvas.addEventListener(
  "pointerdown",
  function(e) {

    /*
      2本指になったら
      シングルタップ予約をキャンセル
    */

    if (
      e.pointerType === "touch"
    ) {

      const activeTouches =
        Array.from(
          activePointers.values()
        );

      activePointers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );

      if (
        activePointers.size >= 2
      ) {

        if (tapTimer) {

          clearTimeout(tapTimer);
          tapTimer = null;
        }

        startPinch();

        return;
      }

    } else {

      activePointers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );
    }

    /*
      マウス・1本指のタップ
    */

    if (
      activePointers.size === 1 &&
      e.pointerType !== "touch"
    ) {

      if (tapTimer) {
        clearTimeout(tapTimer);
      }

      tapTimer = setTimeout(
        () => {

          tapTimer = null;

          if (!isPinching) {

            handleTap(
              e.clientX,
              e.clientY
            );
          }

        },
        300
      );
    }


    if (
      activePointers.size === 1 &&
      e.pointerType === "touch"
    ) {

      if (tapTimer) {
        clearTimeout(tapTimer);
      }

      tapTimer = setTimeout(
        () => {

          tapTimer = null;

          if (
            !isPinching &&
            activePointers.size === 1
          ) {

            handleTap(
              e.clientX,
              e.clientY
            );
          }

        },
        300
      );
    }
  }
);


/* =========================================================
   Pointer Move
   ========================================================= */

canvas.addEventListener(
  "pointermove",
  function(e) {

    if (
      activePointers.has(
        e.pointerId
      )
    ) {

      activePointers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );
    }

    /*
      ピンチ中
    */

    if (
      isPinching &&
      activePointers.size >= 2
    ) {

      updatePinch();

      return;
    }
  }
);


/* =========================================================
   Pointer Up
   ========================================================= */

function pointerEnd(e) {

  activePointers.delete(
    e.pointerId
  );

  if (
    activePointers.size < 2
  ) {

    if (isPinching) {

      isPinching = false;

      pinchStartDistance = 0;
    }
  }
}


canvas.addEventListener(
  "pointerup",
  pointerEnd
);

canvas.addEventListener(
  "pointercancel",
  pointerEnd
);

canvas.addEventListener(
  "pointerleave",
  pointerEnd
);


/* =========================================================
   Active Pointer
   ========================================================= */

const activePointers = new Map();


/* =========================================================
   ピンチ開始
   ========================================================= */

function getPointerDistance() {

  const points =
    Array.from(
      activePointers.values()
    );

  if (points.length < 2) {
    return 0;
  }

  const a = points[0];
  const b = points[1];

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


function startPinch() {

  isPinching = true;

  if (tapTimer) {

    clearTimeout(tapTimer);
    tapTimer = null;
  }

  pinchStartDistance =
    getPointerDistance();

  pinchStartScale =
    scale;
}


/* =========================================================
   ピンチ更新
   ========================================================= */

function updatePinch() {

  const distance =
    getPointerDistance();

  if (
    !pinchStartDistance ||
    !distance
  ) {
    return;
  }

  const ratio =
    distance /
    pinchStartDistance;

  scale =
    pinchStartScale * ratio;

  scale =
    Math.max(
      MIN_SCALE,
      Math.min(
        MAX_SCALE,
        scale
      )
    );

  draw();
}


/* =========================================================
   タッチ開始時の追加対策
   ========================================================= */

canvas.addEventListener(
  "touchstart",
  function(e) {

    if (e.touches.length >= 2) {

      if (tapTimer) {

        clearTimeout(tapTimer);
        tapTimer = null;
      }

      isPinching = true;
    }

  },
  {
    passive: false
  }
);


/* =========================================================
   タッチ終了時
   ========================================================= */

canvas.addEventListener(
  "touchend",
  function(e) {

    if (
      e.touches.length < 2
    ) {

      isPinching = false;
    }

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "touchcancel",
  function() {

    isPinching = false;

    if (tapTimer) {

      clearTimeout(tapTimer);
      tapTimer = null;
    }

  },
  {
    passive: false
  }
);


/* =========================================================
   リセット
   ========================================================= */

resetBtn.addEventListener(
  "click",
  function() {

    if (
      !confirm(
        "この日の記録をすべて削除しますか？"
      )
    ) {
      return;
    }

    shots = [];

    selectedShotIndex = -1;

    saveData();

    updateSelection();

    draw();
  }
);


/* =========================================================
   日付変更
   ========================================================= */

dateInput.addEventListener(
  "change",
  function() {

    loadData();
  }
);


/* =========================================================
   コメント保存
   ========================================================= */

saveBtn.addEventListener(
  "click",
  function() {

    if (
      selectedShotIndex >= 0 &&
      selectedShotIndex < shots.length
    ) {

      shots[
        selectedShotIndex
      ].comment =
        commentInput.value;

      saveData();
    }

    closeModal();
  }
);


/* =========================================================
   コメントキャンセル
   ========================================================= */

cancelBtn.addEventListener(
  "click",
  function() {

    closeModal();
  }
);


/* =========================================================
   モーダル外クリック
   ========================================================= */

modal.addEventListener(
  "click",
  function(e) {

    if (e.target === modal) {

      closeModal();
    }
  }
);


/* =========================================================
   初期化
   ========================================================= */

window.addEventListener(
  "resize",
  function() {

    resizeCanvas();
  }
);


resizeCanvas();

loadData();

</script>

</body>
</html>
